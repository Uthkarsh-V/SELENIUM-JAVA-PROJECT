<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
        }

        #loginBox {
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
        }

        #loginBox h2 {
            margin: 0 0 16px;
            font-size: 1.25rem;
            color: #0f172a;
        }

        #loginBox input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        #loginBox button {
            width: 100%;
            padding: 9px;
            background-color: #1d4ed8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        #loginBox button:hover {
            background-color: #1e40af;
        }

        #message {
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
<div id="loginBox" style="background-color: lightblue; width: 320px; min-height: 230px">
    <h2>Student Login</h2>
    <input id="username" type="text" placeholder="Username" autocomplete="username"><br><br>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password"><br><br>
    <button id="loginButton" type="button" onclick="login()">Login</button>
    <div id="message" role="alert" aria-live="polite"></div>
</div>

<script>
function login() {
    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;
    var messageBox = document.getElementById("message");

    if (username === "student" && password === "12345") {
        messageBox.style.color = "#166534";
        messageBox.innerText = "Login Successful";
    } else {
        messageBox.style.color = "#991b1b";
        messageBox.innerText = "Invalid Username or Password";
    }
}
</script>
</body>
</html>
